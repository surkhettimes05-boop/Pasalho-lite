name: CI

on:
  push:
    branches:
      - main
      - "phase-*"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pasalho
          POSTGRES_PASSWORD: pasalho
          POSTGRES_DB: pasalho_lite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pasalho -d pasalho_lite"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      DATABASE_URL: postgresql://pasalho:pasalho@127.0.0.1:5432/pasalho_lite?schema=public
      AUTH_SECRET: phase-zero-ci-auth-secret-that-is-longer-than-thirty-two-characters
      APP_URL: http://127.0.0.1:3000
      SESSION_TTL_HOURS: "12"
      SEED_OWNER_EMAIL: owner@ci.pasalho.test
      SEED_OWNER_PASSWORD: ci-owner-password-change-outside-ci
      SEED_OWNER_NAME: CI Owner

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Dependency high-severity audit
        run: npm audit --audit-level=high

      - name: Record non-critical dependency findings
        run: npm audit --omit=dev || true

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Apply migrations to empty PostgreSQL
        run: npm run db:migrate:deploy

      - name: Seed Phase 0 operating data
        run: npm run db:seed

      - name: Verify production seed is blocked
        shell: bash
        run: |
          if APP_ENV=production npm run db:seed; then
            echo "Production seed unexpectedly succeeded."
            exit 1
          fi

      - name: Prove controlled production Owner/Admin bootstrap
        shell: bash
        run: |
          docker run --rm --network host -e PGPASSWORD=pasalho postgres:17-alpine \
            psql -h 127.0.0.1 -U pasalho -d postgres \
            -c 'DROP DATABASE IF EXISTS pasalho_bootstrap WITH (FORCE);'
          docker run --rm --network host -e PGPASSWORD=pasalho postgres:17-alpine \
            psql -h 127.0.0.1 -U pasalho -d postgres \
            -c 'CREATE DATABASE pasalho_bootstrap;'

          export DATABASE_URL='postgresql://pasalho:pasalho@127.0.0.1:5432/pasalho_bootstrap?schema=public'
          npm run db:migrate:deploy

          APP_ENV=production \
          BOOTSTRAP_OWNER_EMAIL='bootstrap@ci.pasalho.test' \
          BOOTSTRAP_OWNER_PASSWORD='ci-bootstrap-owner-password-strong' \
          BOOTSTRAP_OWNER_NAME='CI Bootstrap Owner' \
            npm run admin:bootstrap-owner

          docker run --rm --network host -e PGPASSWORD=pasalho postgres:17-alpine \
            psql -h 127.0.0.1 -U pasalho -d pasalho_bootstrap -tAc \
            "SELECT COUNT(*) FROM \"User\" WHERE role='OWNER_ADMIN' AND active=true;" \
            | grep -qx '1'

          docker run --rm --network host -e PGPASSWORD=pasalho postgres:17-alpine \
            psql -h 127.0.0.1 -U pasalho -d pasalho_bootstrap -tAc \
            "SELECT COUNT(*) FROM \"Location\" WHERE code='WAREHOUSE_MAIN' AND type='WAREHOUSE' AND active=true;" \
            | grep -qx '1'

          docker run --rm --network host -e PGPASSWORD=pasalho postgres:17-alpine \
            psql -h 127.0.0.1 -U pasalho -d pasalho_bootstrap -tAc \
            "SELECT COUNT(*) FROM \"Location\" WHERE code='STORE_MAIN' AND type='STORE' AND active=true;" \
            | grep -qx '1'

          if APP_ENV=production \
            BOOTSTRAP_OWNER_EMAIL='second@ci.pasalho.test' \
            BOOTSTRAP_OWNER_PASSWORD='another-bootstrap-password-strong' \
            BOOTSTRAP_OWNER_NAME='Second Owner' \
            npm run admin:bootstrap-owner; then
            echo "Second bootstrap unexpectedly succeeded."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Prove backup and restore
        shell: bash
        run: |
          docker run --rm --network host -e PGPASSWORD=pasalho postgres:17-alpine \
            pg_dump -h 127.0.0.1 -U pasalho -d pasalho_lite \
            --format=custom --no-owner --no-privileges > /tmp/pasalho.dump
          test -s /tmp/pasalho.dump

          docker run --rm --network host -e PGPASSWORD=pasalho postgres:17-alpine \
            psql -h 127.0.0.1 -U pasalho -d postgres \
            -c 'DROP DATABASE IF EXISTS pasalho_restore WITH (FORCE);'
          docker run --rm --network host -e PGPASSWORD=pasalho postgres:17-alpine \
            psql -h 127.0.0.1 -U pasalho -d postgres \
            -c 'CREATE DATABASE pasalho_restore;'
          cat /tmp/pasalho.dump | docker run --rm --network host -i \
            -e PGPASSWORD=pasalho postgres:17-alpine \
            pg_restore -h 127.0.0.1 -U pasalho -d pasalho_restore \
            --no-owner --no-privileges

          SOURCE_DATABASE_URL='postgresql://pasalho:pasalho@127.0.0.1:5432/pasalho_lite?schema=public' \
          RESTORE_DATABASE_URL='postgresql://pasalho:pasalho@127.0.0.1:5432/pasalho_restore?schema=public' \
            npm run db:verify-restore

          DATABASE_URL='postgresql://pasalho:pasalho@127.0.0.1:5432/pasalho_restore?schema=public' \
            npm run db:migrate:deploy

      - name: Canonical end-to-end release test
        shell: bash
        run: |
          docker run --rm --network host -e PGPASSWORD=pasalho postgres:17-alpine \
            psql -h 127.0.0.1 -U pasalho -d postgres \
            -c 'DROP DATABASE IF EXISTS pasalho_e2e WITH (FORCE);'
          docker run --rm --network host -e PGPASSWORD=pasalho postgres:17-alpine \
            psql -h 127.0.0.1 -U pasalho -d postgres \
            -c 'CREATE DATABASE pasalho_e2e;'

          export DATABASE_URL='postgresql://pasalho:pasalho@127.0.0.1:5432/pasalho_e2e?schema=public'
          npm run db:migrate:deploy
          npm run db:seed
          npm run release:e2e

      - name: Production build
        run: npm run build

      - name: Boot smoke test
        shell: bash
        run: |
          npm run start > /tmp/pasalho-lite.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health > /tmp/health.json; then
              cat /tmp/health.json
              curl --fail --silent --show-error http://127.0.0.1:3000/api/ready > /tmp/ready.json
              cat /tmp/ready.json
              exit 0
            fi
            sleep 1
          done

          cat /tmp/pasalho-lite.log
          exit 1
